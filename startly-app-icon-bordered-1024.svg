<?xml version="1.0" encoding="UTF-8"?>
<!-- App Icon - Green accent border variant -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="runnerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8B4E"/>
      <stop offset="100%" stop-color="#1A5C33"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8D4F0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A8D4F0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A8D4F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8B4E"/>
      <stop offset="50%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#1A5C33"/>
    </linearGradient>
  </defs>
  
  <!-- Colored border ring -->
  <rect width="1024" height="1024" rx="228" fill="url(#borderGradient)"/>
  
  <!-- White inner background -->
  <rect x="24" y="24" width="976" height="976" rx="210" fill="#FFFFFF"/>
  
  <!-- Runner graphic - centered and scaled -->
  <g transform="translate(180, 140) scale(5.2)">
    <!-- Ground/shadow ellipse -->
    <ellipse cx="85" cy="152" rx="45" ry="6" fill="url(#ground)"/>
    
    <!-- Motion lines - blue streaks -->
    <path d="M18 62 L38 62" stroke="#4F8EF7" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M10 74 L38 74" stroke="#4F8EF7" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M18 86 L38 86" stroke="#4F8EF7" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Runner - green stick figure -->
    <circle cx="95" cy="38" r="14" fill="url(#runnerBody)"/>
    <path d="M95 52 L82 90" stroke="url(#runnerBody)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M90 62 L68 72 L52 64" stroke="url(#runnerBody)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M90 64 L108 76 L124 72" stroke="url(#runnerBody)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M82 90 L96 112 L108 148" stroke="url(#runnerBody)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M82 90 L58 106 L40 98" stroke="url(#runnerBody)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
